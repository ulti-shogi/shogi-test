<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スマホ特化シューティング</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #111; overflow: hidden; 
            touch-action: none; -webkit-user-select: none; user-select: none; 
            font-family: sans-serif;
        }
        canvas { display: block; }
        
        /* 画面中央のUIコンテナ（表示位置を50%から35%に上げて少し上に配置） */
        .center-ui {
            position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; width: 100%; pointer-events: none;
        }
        
        #startScreen, #pauseScreen, #gameOverScreen { display: none; pointer-events: auto; }
        
        h1 { color: white; text-shadow: 2px 2px 0 #000; margin-bottom: 30px; letter-spacing: 2px; }
        .title-text { color: #00ffcc; font-size: 36px; }
        .gameover-text { color: #ff3333; font-size: 40px; }
        
        button {
            padding: 15px 30px; margin: 10px; font-size: 18px; font-weight: bold;
            color: white; background-color: #007bff; border: none; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: pointer;
        }
        button:active { transform: scale(0.95); } 
        .btn-secondary { background-color: #6c757d; }
        
        #pauseBtn {
            position: absolute; top: 10px; right: 10px;
            padding: 10px 15px; font-size: 16px; font-weight: bold;
            color: white; background-color: rgba(0, 0, 0, 0.5);
            border: 2px solid white; border-radius: 8px;
            display: none; pointer-events: auto; cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <button id="pauseBtn">⏸ 中断</button>

    <div class="center-ui">
        
        <div id="startScreen">
            <h1 class="title-text">スペースシューター</h1>
            <p style="color: white; margin-bottom: 30px;">指でなぞって移動（自動射撃）</p>
            <button id="startBtn">ゲーム開始</button><br>
            <!-- index.htmlに戻るボタンを追加 -->
            <button id="backToTopBtn" class="btn-secondary" style="margin-top: 15px;">トップページに戻る</button>
        </div>

        <div id="pauseScreen">
            <h1>PAUSE</h1>
            <button id="resumeBtn">再開する</button><br>
            <button id="titleBtnFromPause" class="btn-secondary">最初に戻る</button>
        </div>

        <div id="gameOverScreen">
            <h1 class="gameover-text">GAME OVER</h1>
            <button id="restartBtn">もう一度遊ぶ</button><br>
            <button id="titleBtnFromGameOver" class="btn-secondary">最初に戻る</button>
        </div>
        
    </div>
    
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const screens = {
            start: document.getElementById("startScreen"),
            playing: document.getElementById("pauseBtn"), 
            paused: document.getElementById("pauseScreen"),
            gameover: document.getElementById("gameOverScreen")
        };

        let width, height;
        let player = { x: 0, y: 0, w: 40, h: 40 }; 
        let bullets = [];
        let enemies = [];
        let score = 0;
        let frameCount = 0;
        let currentState = "start"; 

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        function changeState(newState) {
            currentState = newState;
            Object.values(screens).forEach(screen => screen.style.display = "none");
            if (screens[newState]) {
                screens[newState].style.display = "block";
            }
        }

        function initGameVariables() {
            bullets = [];
            enemies = [];
            score = 0;
            frameCount = 0;
            player.x = width / 2 - player.w / 2;
            player.y = height - 150;
        }

        function update() {
            if (currentState !== "playing") return;
            frameCount++;

            if (frameCount % 8 === 0) {
                bullets.push({ x: player.x + player.w / 2 - 3, y: player.y, w: 6, h: 15, speed: 12 });
            }

            bullets.forEach(b => b.y -= b.speed);
            bullets = bullets.filter(b => b.y + b.h > 0);

            if (Math.random() < 0.05) {
                let size = 30 + Math.random() * 20;
                enemies.push({ x: Math.random() * (width - size), y: -size, w: size, h: size, speed: 3 + Math.random() * 4 });
            }
            enemies.forEach(e => e.y += e.speed);

            enemies.forEach((e, eIndex) => {
                let margin = 8; 
                if (e.y + e.h > player.y + margin && e.x < player.x + player.w - margin && 
                    e.x + e.w > player.x + margin && e.y < player.y + player.h - margin) {
                    changeState("gameover");
                }
                
                bullets.forEach((b, bIndex) => {
                    if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
                        enemies.splice(eIndex, 1);
                        bullets.splice(bIndex, 1);
                        score += 10;
                    }
                });
            });

            enemies = enemies.filter(e => e.y < height);
        }

        function draw() {
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, width, height);
            
            if (currentState === "start") return;

            if (currentState !== "gameover") {
                ctx.fillStyle = "#00ffcc";
                ctx.beginPath();
                ctx.moveTo(player.x + player.w / 2, player.y);
                ctx.lineTo(player.x + player.w, player.y + player.h);
                ctx.lineTo(player.x, player.y + player.h);
                ctx.fill();
            }

            ctx.fillStyle = "#ffff00";
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
            
            ctx.fillStyle = "#ff4444";
            enemies.forEach(e => ctx.fillRect(e.x, e.y, e.w, e.h));
            
            ctx.fillStyle = "white";
            ctx.font = "bold 24px sans-serif";
            ctx.fillText("SCORE: " + score, 20, 40);

            if (currentState === "paused") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                ctx.fillRect(0, 0, width, height);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // --- ボタンの処理 ---
        document.getElementById("startBtn").addEventListener("click", () => {
            initGameVariables();
            changeState("playing");
        });

        // トップページに戻るボタンの処理を追加
        document.getElementById("backToTopBtn").addEventListener("click", () => {
            window.location.href = "index.html";
        });

        document.getElementById("pauseBtn").addEventListener("click", () => {
            changeState("paused");
        });

        document.getElementById("resumeBtn").addEventListener("click", () => {
            changeState("playing");
        });

        document.getElementById("titleBtnFromPause").addEventListener("click", () => changeState("start") );
        document.getElementById("titleBtnFromGameOver").addEventListener("click", () => changeState("start") );

        document.getElementById("restartBtn").addEventListener("click", () => {
            initGameVariables();
            changeState("playing");
        });

        // --- タッチ操作 ---
        let isTouching = false;

        function movePlayer(e) {
            if (currentState !== "playing") return; 
            e.preventDefault(); 
            const touch = e.touches[0];
            
            player.x = touch.clientX - player.w / 2;
            player.y = touch.clientY - player.h - 60; 

            if (player.x < 0) player.x = 0;
            if (player.x + player.w > width) player.x = width - player.w;
            if (player.y < 0) player.y = 0;
            if (player.y + player.h > height) player.y = height - player.h;
        }

        canvas.addEventListener("touchstart", (e) => {
            isTouching = true;
            movePlayer(e);
        }, {passive: false});

        canvas.addEventListener("touchmove", (e) => {
            if(isTouching) movePlayer(e);
        }, {passive: false});

        canvas.addEventListener("touchend", () => { isTouching = false; });

        let isMouseDown = false;
        canvas.addEventListener("mousedown", (e) => {
            if (currentState !== "playing") return;
            isMouseDown = true;
            player.x = e.clientX - player.w / 2;
            player.y = e.clientY - player.h - 60;
        });
        canvas.addEventListener("mousemove", (e) => {
            if(isMouseDown && currentState === "playing") {
                player.x = e.clientX - player.w / 2;
                player.y = e.clientY - player.h - 60;
            }
        });
        window.addEventListener("mouseup", () => isMouseDown = false );

        changeState("start");
        loop();
    </script>
</body>
</html>
