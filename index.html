<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイゲームポータル</title>
    <style>
        body {
            background-color: #f8f9fa;
            color: #333333;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 画面の中央から上寄りに変更 */
            justify-content: flex-start;
            padding-top: 20vh; 
            height: 100vh;
            box-sizing: border-box;
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #222222;
        }
        
        p {
            font-size: 16px;
            color: #666666;
            margin-bottom: 40px;
            text-align: center;
            padding: 0 20px;
            line-height: 1.5;
        }
        
        .play-button {
            background-color: #007bff;
            color: white;
            text-decoration: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
            transition: all 0.2s ease;
        }
        
        .play-button:active {
            transform: scale(0.95);
            box-shadow: 0 2px 5px rgba(0, 123, 255, 0.3);
        }
    </style>
</head>
<body>
    <h1>ミニゲームコレクション</h1>
    <p>ブラウザですぐに遊べます。<br>下のボタンから起動してください。</p>
    
    <a href="game.html" class="play-button">スペースシューターを遊ぶ</a>
</body>
</html>
