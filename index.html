<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイゲームポータル</title>
    <style>
        /* 白を基調としたクリーンなデザイン */
        body {
            background-color: #f8f9fa; /* 完全な真っ白ではなく、目に優しいオフホワイト */
            color: #333333;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #222222;
        }
        
        p {
            font-size: 16px;
            color: #666666;
            margin-bottom: 40px;
            text-align: center;
            padding: 0 20px;
            line-height: 1.5;
        }
        
        /* ゲーム起動用のボタン */
        .play-button {
            background-color: #007bff;
            color: white;
            text-decoration: none; /* リンクの下線を消す */
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px; /* 角を丸くしてアプリっぽく */
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
            transition: all 0.2s ease;
        }
        
        /* ボタンを押したときのへこむアニメーション */
        .play-button:active {
            transform: scale(0.95);
            box-shadow: 0 2px 5px rgba(0, 123, 255, 0.3);
        }
    </style>
</head>
<body>
    <h1>ミニゲームコレクション</h1>
    <p>ブラウザですぐに遊べるお手軽なゲームです。<br>下のボタンから起動してください。</p>
    
    <!-- game.html へのリンク -->
    <a href="game.html" class="play-button">スペースシューターを遊ぶ</a>
</body>
</html>
